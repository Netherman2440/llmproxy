# Example Prometheus scrape configuration for llmproxy.
#
# Add this to your prometheus.yml under `scrape_configs`:
#
#   scrape_configs:
#     - job_name: "llmproxy"
#       scheme: http                # use https if TLS is enabled
#       metrics_path: /metrics      # default; override via config.toml [metrics] path
#       authorization:
#         type: Bearer
#         credentials_file: /run/secrets/llmproxy_metrics_token
#       static_configs:
#         - targets: ["llm-billing-proxy:8080"]
#           # If running multiple replicas, list them all:
#           # targets: ["llmproxy-0:8080", "llmproxy-1:8080"]

scrape_configs:
  - job_name: "llmproxy"
    scheme: http
    metrics_path: /metrics
    # Dedicated credential, also injected into the proxy's LLMPROXY_METRICS_TOKEN.
    # Mount a protected file; never put the literal token in this manifest.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/llmproxy_metrics_token
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["llm-billing-proxy:8080"]
