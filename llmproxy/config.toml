# Logging level (CRITICAL, ERROR, WARNING, INFO or DEBUG)
log_level = "INFO"

# Listening address
host = "0.0.0.0"
port = 8080

# Backend timeouts
timeout_connect = 5  # connection timeout
timeout_read = 60  # response timeout (global default sock_read; override per-backend)

# Frontend SSE prepare/write/EOF deadline, seconds (default10, restart to change).
# A slow client is disconnected while final backend usage is still drained.
#write_timeout = 10

# Maximum accepted request body size in bytes. Default is 2 GiB so audio and
# PDF uploads work; lower it if this proxy only serves text endpoints.
#client_max_size = 2147483648

# Maximum request body (bytes) for non-upload endpoints (chat/embeddings). Caps
# JSON buffering so a huge body can't OOM the worker; multipart upload routes
# (/v1/audio/transcriptions, /v1/files/convert) are exempt (bounded by
# client_max_size). Default 32 MiB.
#max_json_body = 33554432

# Multipart uploads have separate budgets for text (not file data) and fields.
# Actual decoded request bytes remain bounded by client_max_size. Each part
# also has at most32 headers of at most8190 bytes.
#max_multipart_fields = 128
#max_multipart_text_bytes = 65536

# Decoded non-stream backend response/error budgets (bytes). File-conversion
# results use files.max_poll_response_bytes instead, including synchronous POST.
#max_response_bytes = 33554432
#max_error_response_bytes = 65536

# Seconds to cache a successful API-key lookup in memory. Without it every
# request -- including one that is about to be rejected -- costs a database
# round trip. Default 5; set 0 to disable and query the database every time.
#
# TRADE-OFF: this bounds how long a REVOKED key keeps working (up to this many
# seconds). Key EXPIRY is NOT affected -- the expiry timestamp is re-checked on
# every request, so an expired key is rejected immediately either way. Sending
# SIGHUP flushes the cache, making a revocation take effect at once.
#auth_cache_ttl = 5

# Allowed HTTP origins
# This value will be sent in the Access-Control-Allow-Origin response header.
http_origin = "*"

# Rate limiting: rpm + concurrency PER API KEY, not person/account/namespace.
# Global policy applies when a backend has no per-model value. 0=unlimited;
# absent falls through. Global60rpm means60 per credential across all models,
# not one cap for the service or one billing account's multiple credentials.
# Default mode is local/process; explicit admission.mode=shared coordinates
# replicas in one scope, still per key. No account/daily-token policy fields.
# See docs/admission-contract.md; unknown policy options fail validation.
#[rate_limit]
#rpm = 60
#concurrency = 5

# Body-parser admission, before JSON/multipart reads and model selection.
# Single-process counters survive SIGHUP; timeout bounds unfinished uploads.
# Limits cannot be0/unlimited. Reload updates policy, never active owners.
#[parsing]
#concurrency = 4
#per_user = 2  # legacy option name: per API-key record, NOT billing owner
#timeout = 30

# Shared admission is explicit; local is the default single-process profile.
# All replicas must share scope, database and policy. Mode/scope/lease settings
# require restart (SIGHUP never rebinds active owners to a different scope).
# Shared DB failure/lost ownership fails closed; no local fallback.
#[admission]
#mode = "shared"
#scope = "my-proxy-service"
#lease_ttl = 60
#io_timeout = 5  # must be <=lease_ttl/6

# Polling background file conversions (GET /v1/files/convert/{id}). Polls do
# not count against rpm/concurrency, and for a background submission
# (background=true) concurrency only bounds the upload: the job stays queued
# on the backend after the 202, so only rpm bounds how many jobs a key queues.
# Polls have a limit of their own: each API key may have at most
# max_polls_in_flight polls in flight (more get 429), and a poll answer from
# the backend larger than max_poll_response_bytes is a 502. Reloaded on SIGHUP.
#[files]
#max_polls_in_flight = 4
#max_poll_response_bytes = 134217728  # 128 MiB (Markdown + base64 images)

# EU AI Act Art. 50(2) provenance marking. Generative responses (chat,
# completions, messages, responses) carry an "X-AI-Generated: true" header;
# non-streaming ones additionally get a machine-readable top-level
# "provenance" object (SSE streams are forwarded byte-for-byte, header only).
# Errors, /v1/models and /v1/embeddings are never marked; transcriptions and
# file conversions get the header only. Reloaded on SIGHUP -- set enabled =
# false as the emergency kill switch if a client's strict JSON parser rejects
# the extra field.
#[provenance]
#enabled = true
#generator = "comtegra-llmproxy"  # "generator" value in the provenance object

[metrics]

# Prometheus metrics endpoint.
# Set enabled = false to disable the /metrics endpoint entirely.
enabled = true

# Path under which the metrics endpoint is served.
path = "/metrics"

# Dedicated scrape credential reference, NOT a literal token or LLM API key.
# Set this environment variable through your secret store (32..256 printable
# non-whitespace ASCII characters). Missing/invalid secret makes scrape return 401.
token_env = "LLMPROXY_METRICS_TOKEN"

[db]

# Database URI
# Absolute (e.g. sqlite:///media/api/db.sqlite) or relative (e.g. sqlite://db.sqlite) URL.
# The only supported URL schemas are sqlite and mongodb.
# May be overriden via LLMPROXY_DB_URI environment variable.
uri = "sqlite://db.sqlite"

# Backend definitions
# One backend = one model, selected by the request's `model` field. The backend
# NAME (e.g. [backends.llama3-8b]) is what clients send as "model" and what
# appears in the billing product-string (name/device/kind).
#
# Every backend MUST set `type`, which decides the endpoints it is served on; a
# request for a model on any other endpoint gets 404 and never reaches the
# backend (e.g. chat completions sent to an embedding model):
#   * "chat"          -- /v1/chat/completions, /v1/completions, /v1/messages
#                        (Anthropic) and /v1/responses (OpenAI); a vLLM
#                        generative model speaks them all natively
#   * "embedding"     -- /v1/embeddings (a vLLM pooling/embedding model)
#   * "transcription" -- /v1/audio/transcriptions (whisper microservice)
#   * "realtime"      -- /v1/realtime (WebSocket; realtime STT microservice,
#                        path-preserving) — see the README section
#   * "conversion"    -- /v1/files/convert (marker microservice, PDF->Markdown;
#                        path rewritten to /api/v1/marker)
# Requests are forwarded path-preserving (except "conversion"). `type` is also
# exposed in /v1/models so clients can pick the right endpoint.

# IMPORTANT -- vLLM version pin. /v1/messages and /v1/responses meter usage
# from vLLM's native usage-event shapes, so the vLLM release matters:
#   * < 0.13.0  -- the Anthropic `message_start` event carries NO usage, so the
#                  proxy fails loud (500) on EVERY streaming /v1/messages request.
#                  Do NOT deploy against these.
#   * >= 0.13.0 -- minimum that bills /v1/messages correctly (input_tokens present).
#   * >= 0.21.0 -- RECOMMENDED: also fixes Codex multi-turn on /v1/responses.
#   * 0.24.0    -- version the accumulators were verified against.
# (/v1/messages exists from 0.11.1 and /v1/responses from 0.10.0, but only
# >= 0.13.0 reports usage in the shape this proxy bills.) Pin your vLLM image
# tag accordingly and confirm the streaming usage shapes in a PoC before prod.

# Example vLLM chat backend (chat + completions + messages + responses). A
# client selects it with {"model": "llama3-8b", ...}.
#[backends.llama3-8b]
#url = "https://vllm-llama3.mynamespace.cgc-waw-01.comtegra.cloud"
#token = "mytoken1"
#device = "a5000"  # GPU name; goes into the billing product-string (llama3-8b/a5000/prompt|completion)
#type = "chat"
#model = "meta-llama/Meta-Llama-3-8B-Instruct"  # optional, the real model id vLLM expects (overrides the client's "model"); also exposed as "model_repo" in /v1/models so clients can see which model we serve
#max_model_len = 131072  # optional, real deployment context limit (prompt + completion tokens)
#verify_ssl = true  # optional, set to false to skip certificate verification
#timeout = 300  # optional; RAISE for reasoning / extended-thinking models that can pause >timeout_read (60s) between tokens mid-stream, else the stream 504s and that turn is unbilled

# Optional: per-model overrides for THIS backend. Precedence: per-model then
# global. A per-model limit buckets per (USER, MODEL) — independent of other
# models. 0 = this model is exempt from that dimension.
#[backends.llama3-8b.rate_limit]
#rpm = 30
#concurrency = 3

# Output-budget contract: OFF unless [budget].enabled = true AND the backend
# has output_budget. See docs/budget-contract.md for semantics and live evidence.
# All tables below are commented examples; existing configs remain unchanged.
#[budget]
#enabled = true
#echo_headers = true
#echo_body = true  # turn off JSON metadata for strict response parsers

#[backends.llama3-8b.output_budget]
#mode = "observe"  # changes NO output/reasoning limits; "enforce" opts into policy
#default_max_tokens = 4096
#ceiling = 8192  # per candidate, not a remaining-context or monetary guarantee
#apply_default = false  # requires default_max_tokens; only effective in enforce mode
#clamp = false          # requires ceiling; only effective in enforce mode
#backend_default_max_tokens = 32000  # optional operator note, NOT an effective limit

# Native reasoning control is deliberately limited to /v1/chat/completions.
# Enable only after a live PoC for this model/parser/deployment; requires an
# output_budget section in enforce mode to change requests. vLLM 0.26.0 Qwen
# PoC: top-level thinking_token_budget works on chat, ignored on responses/messages.
#[backends.llama3-8b.reasoning]
#native_budget = false
#endpoints = ["chat"]
#reserve_content_tokens = 1024  # subtract from forwarded output allowance
#effort_budgets = { low = 256, medium = 1024, high = 2048 }
#default_effort = "low"  # optional; OMIT for no default, TOML has no null

# Example vLLM embedding backend (/v1/embeddings only). Billed as
# bge-m3/<device>/embedding (prompt tokens).
#[backends.bge-m3]
#url = "https://vllm-bge-m3.mynamespace.cgc-waw-01.comtegra.cloud"
#token = "mytoken2"
#device = "a5000"
#type = "embedding"
#model = "BAAI/bge-m3"

# Example transcription backend (whisper microservice, /v1/audio/transcriptions).
# Transcription can take minutes, so give it a long per-backend timeout to
# override the global timeout_read. Client selects it with {"model": "whisper-1"}.
#[backends.whisper-1]
#url = "https://whisper.mynamespace.cgc-waw-01.comtegra.cloud"
#token = "APP_TOKEN"  # the microservice's APP_TOKEN (bearer)
#device = "a5000"  # billed as whisper-1/a5000/transcription (per second of audio)
#type = "transcription"
#timeout = 1800  # per-backend response (sock_read) timeout in seconds; audio is silent for minutes

# Example realtime STT backend (streaming transcription over a WebSocket).
# Clients connect to wss://<proxy>/v1/realtime (optional ?model=); the proxy
# authenticates them, opens the backend WebSocket with this token and pumps
# frames both ways. usage.seconds of completed events is metered in
# llmproxy_audio_seconds_total and billed as one ONEOFF event per completed
# segment (see README: Completion logging).
#[backends.parakeet-realtime]
#url = "https://parakeet.example.cgc-krk-01.comtegra.cloud"
#token = "APP_TOKEN"           # the backend's endpoint key (bearer)
#device = "a5000"              # billed as parakeet-realtime/a5000/transcription
#type = "realtime"
#model = "nvidia/parakeet-tdt-0.6b-v3"  # optional: the model id the backend expects
#heartbeat = 30               # optional: WS keepalive ping to the backend, seconds
#health_path = "v1/health"    # optional: the STT pod serves health under /v1

# Example PDF->Markdown backend (marker microservice, /v1/files/convert).
# Conversion can take minutes; use a long per-backend timeout. Client selects
# it with form field model=pdf-to-markdown. Billed as one-off
# pdf-to-markdown/<device>/conversion (quantity = page_count from Marker).
# Put the microservice APP_TOKEN in token= below (do not commit secrets).
# token and device are required: the token also signs the ids of background
# conversions (background=true), so changing it invalidates the ids still
# open; the device names the billed product.
#[backends.pdf-to-markdown]
#url = "https://marker-microservice.apps.cgc-krk-01.comtegra.cloud"
#token = "APP_TOKEN"
#device = "cpu"
#type = "conversion"
#timeout = 1800
#health_path = "healthz"  # marker serves /healthz (not /health)

# Add more backends here

# Basal backend: native /v1/systemone; OpenAI /v1/decisions.
# URL must not include /v1.
# Limits below are proxy policy, per request / per API key+model, not GPU limits.
#[backends.basal-20-max]
#type = "decision"
#decision_adapter = "basal"  # wire protocol; default for existing decision configs
#url = "https://basal-20-max-q8.llm.cgc-krk-01.comtegra.cloud"
#model = "Remek/basal-2.0-max-GGUF"
#device = "a5000"
#token = "mytoken3"
#max_model_len = 32768  # engine context, shared by state and question template
#verify_ssl = true
#timeout = 300
#health_path = "health"
#[backends.basal-20-max.rate_limit]
#rpm = 120
#concurrency = 4  # per key+model; process-local unless explicit shared admission
#[backends.basal-20-max.decision_limits]
#max_questions = 16
#max_branches = 64
#max_response_bytes = 4194304
