[build-system]
requires = ["setuptools==84.2.1"]

[project]
name = "llmproxy"
version = "1.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
	"aiohttp >= 3.14.5, < 4",
	"aiosqlite >= 0.22.1, < 1",
	"prometheus_client >= 0.26.0, < 1",
	"yarl >= 1.25.1, < 2",
]

[project.optional-dependencies]
mongo = ["motor >= 3.7.1, < 4", "pymongo >= 4.19.0, < 5"]

[dependency-groups]
dev = [
	"build==1.6.1",
	"coverage==7.17.2",
	"pip-audit==2.10.1",
	"ruff==0.17.4",
]

[tool.setuptools]
packages = ["llmproxy"]
script-files = ["scripts/llmproxyctl"]
