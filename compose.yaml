# Local SQLite profile. Set LLMPROXY_IMAGE to the verified PRIVATE image@sha256 digest.
services:
  llm-billing-proxy:
    image: ${LLMPROXY_IMAGE:?Set a verified private image pinned by digest}
    command: ["-c", "/run/secrets/llm-billing-proxy-config.toml"]
    user: "10001:10001"
    environment:
      LLMPROXY_DB_URI: sqlite:///state/db.sqlite
      # Reference only; never commit the credential or print rendered compose config.
      LLMPROXY_METRICS_TOKEN: ${LLMPROXY_METRICS_TOKEN:-}
    secrets:
      - llm-billing-proxy-config.toml
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - llmproxy-state:/state
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  llmproxy-state:

secrets:
  llm-billing-proxy-config.toml:
    file: ./secrets/llm-billing-proxy-config.toml
